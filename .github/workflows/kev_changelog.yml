name: Build KEV Changelog

# Triggers:
# - Automatic: on push to 'develop' that changes KEV data files
# - Manual: via the Actions tab (workflow_dispatch)
on:
  push:
    branches: [ develop ]
    paths:
      - known_exploited_vulnerabilities.json
      - known_exploited_vulnerabilities.csv
  workflow_dispatch:

# Ensure the workflow can push back the generated CHANGELOG.md
permissions:
  contents: write

# Prevent overlapping runs for the same branch
concurrency:
  group: kev-changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need full history so we can diff against the previous commit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dateutil

      - name: Generate changelog entry
        run: |
          # Safety: ensure the output file exists with a header (first run)
          if [ ! -f CHANGELOG.md ]; then
            cat > CHANGELOG.md <<'EOF'
# KEV Data Change Log
This file tracks additions, modifications, and removals in the Known Exploited Vulnerabilities (KEV) dataset.
Entries below are auto-generated by the changelog workflow.

---
EOF
          fi

          # Run the script to append the new entry
          python .github/scripts/kev_changelog.py \
            --prev HEAD~1 \
            --curr HEAD \
            --json-path known_exploited_vulnerabilities.json \
            --csv-path known_exploited_vulnerabilities.csv \
            --out CHANGELOG.md

      - name: Commit changelog if changed
        run: |
          # Stage the changelog and commit only if there are changes
          git config user.name "kev-sync-bot"
          git config user.email "actions@users.noreply.github.com"

          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update KEV changelog for ${{ github.sha }}"
            git push
          else
            echo "No changes in CHANGELOG.md; skipping commit."
          fi
