name: Build KEV Changelog + Ransomware Changes

on:
  push:
    branches: [ develop ]
    paths:
      - known_exploited_vulnerabilities.json
      - known_exploited_vulnerabilities.csv

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for diffing with previous commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas python-dateutil

      - name: Generate changelog + ransomware summary
        run: |
          python .github/scripts/kev_changelog.py \
            --prev HEAD~1 \
            --curr HEAD \
            --json-path known_exploited_vulnerabilities.json \
            --csv-path known_exploited_vulnerabilities.csv \
            --changelog CHANGELOG.md \
            --ransomware ransomware_changes.md

      - name: Commit artifacts
        run: |
          git config user.name "kev-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md ransomware_changes.md
          # no-op if nothing changed
          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update KEV changelog & ransomware summary for ${{ github.sha }}"
            git push
          fi
