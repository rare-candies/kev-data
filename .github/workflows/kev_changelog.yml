name: Build KEV Changelog

on:
  push:
    branches: [develop]
    paths:
      - known_exploited_vulnerabilities.json
      - known_exploited_vulnerabilities.csv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dateutil

      - name: Ensure CHANGELOG.md exists
        shell: bash
        run: |
          if [ ! -f CHANGELOG.md ]; then
            printf "# KEV Data Change Log\nThis file tracks additions, modifications, and removals in the Known Exploited Vulnerabilities (KEV) dataset.\nEntries below are auto-generated by the changelog workflow.\n\n---\n" > CHANGELOG.md
          fi

      - name: Generate changelog entry
        shell: bash
        run: |
          python .github/scripts/kev_changelog.py \
            --prev HEAD~1 \
            --curr HEAD \
            --json-path known_exploited_vulnerabilities.json \
            --csv-path known_exploited_vulnerabilities.csv \
            --out CHANGELOG.md

      - name: Commit changelog if changed
        shell: bash
        run: |
          git config user.name "kev-sync-bot"
          git config user.email "actions@users.noreply.github.com"

          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update KEV changelog for ${{ github.sha }}"
            git push
          else
            echo "No changes in CHANGELOG.md; skipping commit."
          fi
